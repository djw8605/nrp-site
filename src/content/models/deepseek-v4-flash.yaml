summary: DeepSeek's 522B causal encoder-decoder MoE — image input, a full million-token context window, and only 8-16B parameters active per token.
strengths:
  - 1M context — tied with glm-5 for the largest window in the catalog, for whole-codebase and long-document work
  - Image input alongside that context — screenshots, figures, and scanned pages
  - MoE routing keeps latency low relative to total parameter count
  - An FP4 KV cache at 890 bytes per token keeps a full million-token context under a gigabyte
  - Strong reasoning and tool calling
weaknesses:
  - Images only — no video or audio input
  - Recently released architecture on an evaluating model; availability and configuration may shift
  - Thinking is on by default at max effort; lower reasoning_effort, or disable thinking, for simple queries
  - Long-context requests are memory-hungry; expect slower first-token latency near the limit
bestFor:
  - Whole-repository code understanding
  - Long-document analysis and summarization
  - Documents that mix long text with figures, screenshots, or scanned pages
  - Reasoning tasks that need the full context window
