stages:
  - build
  - clear

build:
  stage: build
  image: node:lts
  rules:
    - changes:
        - .gitignore
        - .gitlab-ci.yml
        - LICENSE.md
        - README.md
      when: never
    - changes:
        - src/**/*
        - static/**/*
        - astro.config.ts
        - package.json
        - package-lock.json
      when: on_success
    - when: manual
  before_script:
    - npm ci
    - npm i wrangler --location=global
  script:
    - npm run build
    - wrangler pages deploy ./public --project-name "nrp-portal" --branch "$CI_COMMIT_REF_NAME"

clear:
  stage: clear
  image: ubuntu:latest
  script:
    - ./clear-cloudflare.sh