stages:
  - build
  - clear

build:
  stage: build
  image: node:lts
  # No deny-list. `rules` stops at the first match, so a deny-list ahead of the
  # allow-list suppressed the deploy for any commit that merely touched
  # .gitignore or .gitlab-ci.yml -- including the merge commit that rebuilt the
  # whole site, because a merge is diffed against its first parent. The
  # allow-list alone is enough: anything it does not match falls through to
  # `when: manual` and simply does not deploy on its own.
  rules:
    - changes:
        - src/**/*
        - static/**/*
        - astro.config.ts
        - .gitlab-ci.yml
        - package.json
        - package-lock.json
      when: on_success
    - when: manual
  before_script:
    - npm ci
    - npm i wrangler --location=global
  script:
    - echo "CI_PIPELINE_SOURCE=$CI_PIPELINE_SOURCE"
    - echo "CI_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME"
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
    - echo "CI_MERGE_REQUEST_SOURCE_BRANCH_NAME=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - 'export PAGES_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"'
    - 'echo "Deploying Cloudflare Pages branch: $PAGES_BRANCH"'
    - npm run build
    - wrangler pages deploy ./public --project-name "nrp-portal" --branch "$PAGES_BRANCH"

clear:
  stage: clear
  image: ubuntu:latest
  script:
    - ./clear-cloudflare.sh
